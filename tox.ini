[tox]
envlist = py311
skipsdist = True

[testenv]
deps =
    -r backend/requirements.txt
    pytest==8.2.2
    pytest-cov==5.0.0
    coverage==7.5.3
setenv =
    PYTHONPATH = {toxinidir}/backend
    DATABASE_URL = sqlite:////tmp/nockbill_test.sqlite3
    ENVIRONMENT = test
commands =
    pytest backend/tests --cov=backend/app --cov-report=xml:coverage.xml --cov-config=tox.ini --cov-branch -v

[coverage:run]
relative_files = True
source = backend/app
branch = True
omit =
    backend/tests/*
    */__pycache__/*

[coverage:report]
show_missing = True
