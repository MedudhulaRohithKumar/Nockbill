name: SonarCloud Code Analysis

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend & Frontend Test Dependencies
        run: |
          pip install --only-binary :all: -r backend/requirements.txt
          npm --prefix frontend ci --ignore-scripts

      - name: Run Backend Tests & Generate Coverage XML
        run: python3 backend/tests/generate_coverage_xml.py

      - name: Run Frontend Tests & Generate LCOV Coverage
        run: node frontend/scripts/run_coverage.mjs

      - name: Verify Coverage Reports
        run: |
          test -f coverage.xml || { echo "coverage.xml missing!"; exit 1; }
          test -f frontend/coverage/lcov.info || { echo "frontend/coverage/lcov.info missing!"; exit 1; }
          echo "Verified coverage.xml and frontend/coverage/lcov.info"

      - name: Check SONAR_TOKEN configuration
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning::SONAR_TOKEN secret is not set in GitHub Actions secrets. Add SONAR_TOKEN and turn OFF SonarQube Cloud Automatic Analysis (Administration > Analysis Method) to upload CI coverage."

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
