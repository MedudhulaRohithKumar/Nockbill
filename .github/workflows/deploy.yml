name: Deploy Kisan Seva Kendra to AWS Serverless

on:
  push:
    branches:
      - main
      - Dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment (prod/dev)'
        required: true
        default: 'prod'

jobs:
  build-and-deploy:
    name: Build & Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build SPA
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run build
          cd ..

      - name: Verify Frontend Production Build
        run: |
          test -f frontend/dist/index.html || { echo "Frontend dist/index.html missing!"; exit 1; }
          echo "Frontend SPA bundle successfully verified."

      - name: Set up Python 3.13
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'

      - name: Set up AWS SAM CLI
        run: |
          curl --proto "=https" -fsSL https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip -o aws-sam-cli.zip
          unzip -q aws-sam-cli.zip -d sam-installation
          sudo ./sam-installation/install --update
          rm -rf aws-sam-cli.zip sam-installation
          sam --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Validate CloudFormation / SAM Template
        run: |
          sam validate --lint --template-file infrastructure/cloudformation_serverless.yaml

      - name: Clean Up Stuck Empty Stack (REVIEW_IN_PROGRESS / ROLLBACK_COMPLETE)
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          STACK_NAME="ks-serverless-${ENV_NAME}"
          STATUS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --region "${AWS_REGION}" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
          echo "Current stack status for ${STACK_NAME}: ${STATUS}"
          if [ "${STATUS}" = "REVIEW_IN_PROGRESS" ] || [ "${STATUS}" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting empty failed stack ${STACK_NAME} (status: ${STATUS}) before fresh deployment..."
            aws cloudformation delete-stack --stack-name "${STACK_NAME}" --region "${AWS_REGION}"
            aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}" --region "${AWS_REGION}"
            echo "Deleted empty stack ${STACK_NAME}."
          fi

      - name: Build SAM Serverless Application
        run: |
          sam build --template-file infrastructure/cloudformation_serverless.yaml

      - name: Prepare Encrypted RDS Snapshot Migration (Zero Data Loss)
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          STACK_NAME="ks-serverless-${ENV_NAME}"
          LEGACY_DB="ks-postgres-${ENV_NAME}"
          ENC_DB="ks-postgres-${ENV_NAME}-enc"
          UNENC_SNAP="${LEGACY_DB}-unenc-backup-v1"
          ENC_SNAP="${LEGACY_DB}-encrypted-migration-v1"

          if aws rds describe-db-instances --region "${AWS_REGION}" --db-instance-identifier "${ENC_DB}" >/dev/null 2>&1; then
            echo "Encrypted RDS instance ${ENC_DB} already exists. Preserving existing DbSnapshotIdentifier parameter."
            EXISTING_SNAP=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Parameters[?ParameterKey=='DbSnapshotIdentifier'].ParameterValue | [0]" \
              --output text 2>/dev/null || echo "")
            if [ "${EXISTING_SNAP}" = "None" ]; then
              EXISTING_SNAP=""
            fi
            echo "DB_SNAPSHOT_ID=${EXISTING_SNAP}" >> "$GITHUB_ENV"
          elif aws rds describe-db-instances --region "${AWS_REGION}" --db-instance-identifier "${LEGACY_DB}" >/dev/null 2>&1; then
            echo "Legacy unencrypted RDS instance ${LEGACY_DB} detected. Preparing encrypted snapshot ${ENC_SNAP}..."
            if ! aws rds describe-db-snapshots --region "${AWS_REGION}" --db-snapshot-identifier "${ENC_SNAP}" >/dev/null 2>&1; then
              if ! aws rds describe-db-snapshots --region "${AWS_REGION}" --db-snapshot-identifier "${UNENC_SNAP}" >/dev/null 2>&1; then
                echo "Creating source snapshot ${UNENC_SNAP} from ${LEGACY_DB}..."
                aws rds create-db-snapshot \
                  --region "${AWS_REGION}" \
                  --db-instance-identifier "${LEGACY_DB}" \
                  --db-snapshot-identifier "${UNENC_SNAP}"
              fi
              echo "Waiting for source snapshot ${UNENC_SNAP} to complete..."
              aws rds wait db-snapshot-completed \
                --region "${AWS_REGION}" \
                --db-snapshot-identifier "${UNENC_SNAP}"

              echo "Copying ${UNENC_SNAP} into KMS-encrypted snapshot ${ENC_SNAP}..."
              aws rds copy-db-snapshot \
                --region "${AWS_REGION}" \
                --source-db-snapshot-identifier "${UNENC_SNAP}" \
                --target-db-snapshot-identifier "${ENC_SNAP}" \
                --kms-key-id alias/aws/rds \
                --copy-tags
            fi
            echo "Waiting for encrypted snapshot ${ENC_SNAP} to complete..."
            aws rds wait db-snapshot-completed \
              --region "${AWS_REGION}" \
              --db-snapshot-identifier "${ENC_SNAP}"
            echo "Encrypted snapshot ${ENC_SNAP} is ready for zero-data-loss restore."
            echo "DB_SNAPSHOT_ID=${ENC_SNAP}" >> "$GITHUB_ENV"
          else
            echo "No legacy unencrypted RDS instance found; fresh encrypted RDS instance will be created."
            echo "DB_SNAPSHOT_ID=" >> "$GITHUB_ENV"
          fi

      - name: Deploy to AWS SAM
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.REPORT_NOTIFICATION_EMAIL || 'admin@nockbill.local' }}
          DB_BACKUP_RETENTION: ${{ vars.DB_BACKUP_RETENTION_DAYS || '1' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${DB_PASSWORD}" ]; then
            echo "ERROR: DB_PASSWORD secret must be configured in GitHub repository secrets." >&2
            exit 1
          fi
          if [ ${#DB_PASSWORD} -lt 8 ]; then
            echo "ERROR: DB_PASSWORD must be at least 8 characters long." >&2
            exit 1
          fi
          if echo "${DB_PASSWORD}" | grep -qE '[/@" ]'; then
            echo "ERROR: DB_PASSWORD contains forbidden characters ('/', '@', '\"', or spaces). AWS RDS rejects these characters." >&2
            echo "Please update DB_PASSWORD in GitHub Secrets with a password containing only letters, numbers, and allowed symbols (e.g. KisanSecure2026_Prod!)." >&2
            exit 1
          fi

          PARAM_OVERRIDES=(
            "Environment=${ENV_NAME}"
            "DbUsername=kisan_admin"
            "DbPassword=${DB_PASSWORD}"
            "DbAllocatedStorage=20"
            "DbBackupRetentionPeriod=${DB_BACKUP_RETENTION}"
            "VpcCidr=10.0.0.0/16"
            "ReportNotificationEmail=${NOTIFY_EMAIL}"
          )
          if [ -n "${DB_SNAPSHOT_ID:-}" ]; then
            PARAM_OVERRIDES+=("DbSnapshotIdentifier=${DB_SNAPSHOT_ID}")
          fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            PARAM_OVERRIDES+=("GeminiApiKey=${GEMINI_API_KEY}")
          fi
          if [ -n "${GROQ_API_KEY:-}" ]; then
            PARAM_OVERRIDES+=("GroqApiKey=${GROQ_API_KEY}")
          fi

          sam deploy \
            --config-file infrastructure/samconfig.toml \
            --stack-name ks-serverless-${ENV_NAME} \
            --region ${AWS_REGION} \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

      - name: Run Post-Deploy Database Schema Migrations
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          echo "Running idempotent PostgreSQL schema migrations via ks-backend-api-${ENV_NAME}..."
          aws lambda invoke \
            --region "${AWS_REGION}" \
            --function-name "ks-backend-api-${ENV_NAME}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"migrate_and_seed"}' \
            migration_result.json
          cat migration_result.json
          echo ""
          if grep -q '"errorMessage"' migration_result.json; then
            echo "ERROR: Post-deploy database migration failed!" >&2
            exit 1
          fi

      - name: Diagnose CloudFormation Failure Events
        if: failure()
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          STACK_NAME="ks-serverless-${ENV_NAME}"
          echo "=== Failed ChangeSets ==="
          aws cloudformation list-change-sets --stack-name "${STACK_NAME}" --region "${AWS_REGION}" --output table || true
          echo "=== Recent CloudFormation Stack Events ==="
          aws cloudformation describe-stack-events --stack-name "${STACK_NAME}" --region "${AWS_REGION}" --max-items 25 --query "StackEvents[*].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" --output table || true

      - name: Print Stack Outputs
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          echo "=========================================================="
          echo " Deployment Complete! Stack Outputs:"
          echo "=========================================================="
          aws cloudformation describe-stacks \
            --stack-name ks-serverless-${ENV_NAME} \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table
