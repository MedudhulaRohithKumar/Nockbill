AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Kisan Seva Kendra - Serverless Architecture:
  FastAPI Backend (Lambda Container) + React Frontend (Lambda) + RDS PostgreSQL with RDS Proxy
  + 4 Dedicated S3 Buckets (Date-wise Folders) + Step Functions + Lambda Function URLs

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  DbUsername:
    Type: String
    Default: kisan_admin
    Description: Master username for RDS PostgreSQL

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[^/@\" \\\\]+$"
    ConstraintDescription: "Master password must be at least 8 characters and cannot contain '/', '@', '\"', backslash, or spaces."
    Description: >
      Master password for RDS PostgreSQL (NoEcho; min 8 chars; cannot contain '/', '@', '"', backslash or spaces).
      It is stored ONLY in RDS and the PostgreSqlSecret Secrets Manager secret; the backend Lambda reads it at
      runtime via DB_SECRET_ARN and never receives it as an environment variable.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class (db.t4g.micro = free tier / dev; use db.t4g.small or larger for production load)

  DeletionProtectionEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Enable RDS deletion protection (keep 'true' for production). Set to 'false' first
      (and update the stack) before intentionally deleting the stack.

  MultiAzEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable RDS Multi-AZ standby. 'false' is acceptable for dev; set to 'true' for production.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Allocated storage in GB for RDS PostgreSQL

  DbBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Automated backup retention period in days (AWS Free Plan caps this at 1; use 7+ on paid plans)

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  ReportNotificationEmail:
    Type: String
    Default: admin@kisansevakendra.local
    Description: Notification email for generated reports and deployment alerts

  BackendEnvironment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Value of the ENVIRONMENT variable consumed by the backend application (controls prod-only hardening)

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://nockbill.com
    Description: >
      Comma-separated list of exact browser origins (scheme://host[:port]) allowed for CORS.
      Wildcards are NOT allowed. Include the CloudFront/custom-domain origin that serves the SPA.

  SubscriptionPaymentMode:
    Type: String
    Default: live
    AllowedPattern: "^[a-z_]{2,32}$"
    Description: Subscription payment mode passed to the backend (SUBSCRIPTION_PAYMENT_MODE), default 'live'

  BackendReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Optional ReservedConcurrentExecutions for the backend Lambda (0 = omit/unreserved,
      safe on accounts with the default 10-concurrency quota; set to 20+ once quota is raised).

  DbSnapshotIdentifier:
    Type: String
    Default: ""
    Description: >
      Optional encrypted RDS snapshot identifier to restore from when migrating an existing
      unencrypted database to encrypted storage with zero data loss. Leave empty for fresh stacks.

Conditions:
  EnableDeletionProtection: !Equals [!Ref DeletionProtectionEnabled, 'true']
  EnableMultiAz: !Equals [!Ref MultiAzEnabled, 'true']
  UseDbSnapshot: !Not [!Equals [!Ref DbSnapshotIdentifier, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref BackendReservedConcurrency, 0]]

Resources:
  # ============================================================================
  # 1. NETWORKING (VPC, Subnets, Security Groups)
  # ============================================================================
  ServerlessVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ks-vpc-${Environment}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerlessVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ks-private-subnet-1-${Environment}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerlessVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ks-private-subnet-2-${Environment}

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Kisan RDS and Proxy
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ks-db-subnet-group-${Environment}

  # ----------------------------------------------------------------------------
  # Outbound internet for the VPC-attached Backend Lambda.
  # Without this, the Lambda cannot reach Google (Sign-In verification),
  # Amazon SES (emails) or any external API — requests hang until timeout,
  # which surfaces as "Service Unavailable" (503) / "invalid or expired token".
  # Lambda stays in PRIVATE subnets (no public IP); only the NAT is public.
  # ----------------------------------------------------------------------------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ks-igw-${Environment}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ServerlessVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerlessVpc
      CidrBlock: 10.0.101.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ks-public-subnet-1-${Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ServerlessVpc
      Tags:
        - Key: Name
          Value: !Sub ks-public-rt-${Environment}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ks-nat-eip-${Environment}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ks-nat-${Environment}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ServerlessVpc
      Tags:
        - Key: Name
          Value: !Sub ks-private-rt-${Environment}

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Free Gateway endpoint: S3 traffic (invoices, reports) stays on the AWS network
  # and does not incur NAT data-processing charges.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ServerlessVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Backend Lambda to access RDS Proxy
      VpcId: !Ref ServerlessVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ks-lambda-sg-${Environment}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL and RDS Proxy
      VpcId: !Ref ServerlessVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ks-database-sg-${Environment}

  DatabaseSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DatabaseSecurityGroup

  # ============================================================================
  # 2. DATABASE: Amazon RDS PostgreSQL (instance class via DbInstanceClass; default free-tier db.t4g.micro)
  # Direct connection from Lambda (RDS Proxy is not available on free tier accounts)
  # ============================================================================
  PostgreSqlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ks-db-credentials-${Environment}
      Description: Database credentials for Kisan Seva Kendra RDS
      # JSON keys consumed by the backend: username, password (+ host/port/dbname for reference).
      SecretString: !Sub >
        {
          "username": "${DbUsername}",
          "password": "${DbPassword}",
          "engine": "postgres",
          "host": "${PostgreSqlInstance.Endpoint.Address}",
          "port": ${PostgreSqlInstance.Endpoint.Port},
          "dbname": "kisan_seva_db"
        }

  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ks-jwt-signing-secret-${Environment}
      Description: Cryptographically secure 64-character signing secret for backend JWT tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  GoogleBridgeSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ks-google-bridge-secret-${Environment}
      Description: Cryptographically secure 64-character shared HMAC secret for Google OAuth bridge
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PaymentWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ks-payment-webhook-secret-${Environment}
      Description: Shared HMAC secret used to verify subscription payment webhooks (generated, never in template)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PostgreSqlInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1011
    Properties:
      DBInstanceIdentifier: !Sub ks-postgres-${Environment}-enc
      Engine: postgres
      EngineVersion: !If [UseDbSnapshot, !Ref AWS::NoValue, "16.10"]
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !If [UseDbSnapshot, !Ref AWS::NoValue, !Ref DbAllocatedStorage]
      StorageType: gp3
      DBSnapshotIdentifier: !If [UseDbSnapshot, !Ref DbSnapshotIdentifier, !Ref AWS::NoValue]
      DBName: !If [UseDbSnapshot, !Ref AWS::NoValue, kisan_seva_db]
      MasterUsername: !If [UseDbSnapshot, !Ref AWS::NoValue, !Ref DbUsername]
      MasterUserPassword: !If [UseDbSnapshot, !Ref AWS::NoValue, !Ref DbPassword]
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: !If [EnableMultiAz, true, false]
      DeletionProtection: !If [EnableDeletionProtection, true, false]
      BackupRetentionPeriod: !Ref DbBackupRetentionPeriod
      # When restoring from an encrypted snapshot, AWS RDS inherits encryption from the snapshot
      # and forbids setting StorageEncrypted explicitly; fresh instances always enable encryption.
      StorageEncrypted: !If [UseDbSnapshot, !Ref AWS::NoValue, true]
      Tags:
        - Key: Name
          Value: !Sub ks-postgres-${Environment}-enc

  # ============================================================================
  # 3. S3 STORAGE: DEDICATED ACCESS LOGS & 4 DATA BUCKETS
  # ============================================================================
  S3AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-s3-access-logs-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldAccessLogs
            Status: Enabled
            ExpirationInDays: 90

  SalesInvoicesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-sales-invoices-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: sales-invoices/
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldInvoices
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 365
                StorageClass: GLACIER

  PurchaseBillsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-purchase-bills-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: purchase-bills/
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldPurchases
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA

  GstReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-gst-reports-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: gst-reports/
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldGstReports
            Status: Enabled
            Transitions:
              - TransitionInDays: 180
                StorageClass: STANDARD_IA

  StockReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-stock-reports-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: stock-reports/

  # ============================================================================
  # 4. NOTIFICATIONS: Amazon SNS
  # ============================================================================
  ReportAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ks-report-alerts-${Environment}
      Subscription:
        - Protocol: email
          Endpoint: !Ref ReportNotificationEmail

  # ============================================================================
  # 5. COMPUTE: AWS LAMBDA BACKEND & FRONTEND WITH FUNCTION URLS
  # ============================================================================
  BackendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-backend-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3ReportAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:HeadObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${SalesInvoicesBucket.Arn}/*
                  - !Sub ${PurchaseBillsBucket.Arn}/*
                  - !Sub ${GstReportsBucket.Arn}/*
                  - !Sub ${StockReportsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSigningSecret
                  - !Ref GoogleBridgeSigningSecret
                  - !Ref PaymentWebhookSecret
              # DB credentials: read at runtime via DB_SECRET_ARN (this secret ARN only)
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref PostgreSqlSecret
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ks-backend-api-${Environment}
      PackageType: Image
      MemorySize: 1024
      Timeout: 30
      # Bounds concurrent DB connections when explicitly enabled (see BackendReservedConcurrency).
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref BackendReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt BackendLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          ENVIRONMENT: !Ref BackendEnvironment
          # DB credentials are NOT passed in env vars: the app fetches JSON keys `username`
          # and `password` from Secrets Manager (DB_SECRET_ARN) and builds the URL itself.
          DB_SECRET_ARN: !Ref PostgreSqlSecret
          DB_HOST: !GetAtt PostgreSqlInstance.Endpoint.Address
          DB_PORT: !GetAtt PostgreSqlInstance.Endpoint.Port
          DB_NAME: kisan_seva_db
          # Lambda: one execution environment handles one request at a time -> tiny pool.
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "1"
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          AUTO_MIGRATE_ON_STARTUP: "false"
          ENABLE_API_DOCS: "false"
          SUBSCRIPTION_PAYMENT_MODE: !Ref SubscriptionPaymentMode
          PAYMENT_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${PaymentWebhookSecret}:SecretString}}'
          S3_ENABLED: "True"
          S3_INVOICES_BUCKET: !Ref SalesInvoicesBucket
          S3_PURCHASES_BUCKET: !Ref PurchaseBillsBucket
          S3_GST_REPORTS_BUCKET: !Ref GstReportsBucket
          S3_STOCK_REPORTS_BUCKET: !Ref StockReportsBucket
          AWS_REGION_NAME: !Ref AWS::Region
          SES_ENABLED: "True"
          SES_SENDER_EMAIL: "admin@nockbill.com"
          SES_REGION: !Ref AWS::Region
          APP_BASE_URL: "https://nockbill.com"
          GOOGLE_CLIENT_ID: "995123724994-6ejbal37p88sp32fmedph6k296uf8n7k.apps.googleusercontent.com"
          SECRET_KEY: !Sub '{{resolve:secretsmanager:${JwtSigningSecret}:SecretString}}'
          GOOGLE_BRIDGE_SECRET: !Sub '{{resolve:secretsmanager:${GoogleBridgeSigningSecret}:SecretString}}'
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      DockerTag: latest
      DockerContext: ../backend
      Dockerfile: Dockerfile.lambda

  FrontendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-frontend-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadBridgeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleBridgeSigningSecret

  FrontendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ks-frontend-spa-${Environment}
      Runtime: python3.13
      Handler: lambda_handler.handler
      CodeUri: ../frontend
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt FrontendLambdaRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref BackendEnvironment
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          BACKEND_API_URL: !GetAtt BackendFunctionUrl.FunctionUrl
          GOOGLE_CLIENT_ID: "995123724994-6ejbal37p88sp32fmedph6k296uf8n7k.apps.googleusercontent.com"
          GOOGLE_BRIDGE_SECRET: !Sub '{{resolve:secretsmanager:${GoogleBridgeSigningSecret}:SecretString}}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Ref AllowedOrigins
          AllowMethods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - HEAD
          AllowHeaders:
            - Authorization
            - Content-Type
            - Accept
            - X-Requested-With
          MaxAge: 86400

  # ============================================================================
  # 6. ORCHESTRATION: AWS STEP FUNCTIONS (BACKEND & FRONTEND SEPARATELY)
  # ============================================================================
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-stepfunctions-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionExecutePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt BackendFunction.Arn
                  - !GetAtt FrontendFunction.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ReportAlertTopic

  BackendReportsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ks-backend-reports-pipeline-${Environment}
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub >
        {
          "Comment": "Kisan Seva Kendra - Asynchronous Monthly Financial & GST Report Generator",
          "StartAt": "ExtractMonthlyTransactions",
          "States": {
            "ExtractMonthlyTransactions": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${BackendFunction.Arn}",
                "Payload": {
                  "action": "extract_monthly_summary",
                  "month.$": "$.month",
                  "year.$": "$.year"
                }
              },
              "Next": "GenerateGstAndStockDocuments"
            },
            "GenerateGstAndStockDocuments": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "GenerateGstPdfAndUploadS3",
                  "States": {
                    "GenerateGstPdfAndUploadS3": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "${BackendFunction.Arn}",
                        "Payload": {
                          "action": "generate_gst_report_pdf",
                          "category": "gst_report",
                          "month.$": "$.month",
                          "year.$": "$.year"
                        }
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "GenerateStockValuationExcelAndUploadS3",
                  "States": {
                    "GenerateStockValuationExcelAndUploadS3": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "${BackendFunction.Arn}",
                        "Payload": {
                          "action": "generate_stock_valuation_excel",
                          "category": "stock_report",
                          "month.$": "$.month",
                          "year.$": "$.year"
                        }
                      },
                      "End": true
                    }
                  }
                }
              ],
              "Next": "NotifyOwnerReportReady"
            },
            "NotifyOwnerReportReady": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${ReportAlertTopic}",
                "Subject": "Monthly GST & Stock Report Ready - Kisan Seva Kendra",
                "Message": {
                  "status": "COMPLETED",
                  "period.$": "$.[0].period",
                  "gstReportUrl.$": "$.[0].downloadUrl",
                  "stockReportUrl.$": "$.[1].downloadUrl"
                }
              },
              "End": true
            }
          }
        }

  FrontendDeployStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ks-frontend-deploy-pipeline-${Environment}
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub >
        {
          "Comment": "Kisan Seva Kendra - Frontend SPA Asset Warmup & Deployment Pipeline",
          "StartAt": "ValidateFrontendBundle",
          "States": {
            "ValidateFrontendBundle": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${FrontendFunction.Arn}",
                "Payload": {
                  "action": "validate_bundle"
                }
              },
              "Next": "PrewarmFrontendContainers"
            },
            "PrewarmFrontendContainers": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${FrontendFunction.Arn}",
                "Payload": {
                  "action": "warmup"
                }
              },
              "Next": "NotifyFrontendReady"
            },
            "NotifyFrontendReady": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${ReportAlertTopic}",
                "Subject": "SUCCESS: Frontend Deployed & Prewarmed",
                "Message": {
                  "status": "ACTIVE",
                  "environment": "${Environment}"
                }
              },
              "End": true
            }
          }
        }

Outputs:
  FrontendFunctionUrl:
    Description: Immediate public HTTPS Function URL to access Frontend SPA
    Value: !GetAtt FrontendFunctionUrl.FunctionUrl

  BackendFunctionUrl:
    Description: Immediate public HTTPS Function URL to access Backend FastAPI
    Value: !GetAtt BackendFunctionUrl.FunctionUrl

  PaymentWebhookSecretArn:
    Description: Secrets Manager ARN of the payment webhook HMAC secret (configure the same value at the payment provider)
    Value: !Ref PaymentWebhookSecret

  RdsEndpoint:
    Description: Amazon RDS PostgreSQL Endpoint
    Value: !GetAtt PostgreSqlInstance.Endpoint.Address

  SalesInvoicesBucketName:
    Description: S3 Bucket storing Sales Invoices
    Value: !Ref SalesInvoicesBucket

  PurchaseBillsBucketName:
    Description: S3 Bucket storing Purchase Bills
    Value: !Ref PurchaseBillsBucket

  GstReportsBucketName:
    Description: S3 Bucket storing GST Reports
    Value: !Ref GstReportsBucket

  StockReportsBucketName:
    Description: S3 Bucket storing Stock Valuation Reports
    Value: !Ref StockReportsBucket

  BackendReportsStateMachineArn:
    Description: ARN for Backend Reports Step Functions State Machine
    Value: !GetAtt BackendReportsStateMachine.Arn

  FrontendDeployStateMachineArn:
    Description: ARN for Frontend Deployment Step Functions State Machine
    Value: !GetAtt FrontendDeployStateMachine.Arn
