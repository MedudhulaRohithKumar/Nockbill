AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Kisan Seva Kendra - Serverless Architecture:
  FastAPI Backend (Lambda Container) + React Frontend (Lambda) + RDS PostgreSQL with RDS Proxy
  + 4 Dedicated S3 Buckets (Date-wise Folders) + Step Functions + Lambda Function URLs

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  DbUsername:
    Type: String
    Default: kisan_admin
    Description: Master username for RDS PostgreSQL

  DbPassword:
    Type: String
    NoEcho: true
    Default: KisanSecurePass2026!
    Description: Master password for RDS PostgreSQL (Min 8 chars)

  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Allocated storage in GB for RDS PostgreSQL

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  ReportNotificationEmail:
    Type: String
    Default: admin@kisansevakendra.local
    Description: Notification email for generated reports and deployment alerts

Resources:
  # ============================================================================
  # 1. NETWORKING (VPC, Subnets, Security Groups)
  # ============================================================================
  ServerlessVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ks-vpc-${Environment}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerlessVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ks-private-subnet-1-${Environment}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerlessVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ks-private-subnet-2-${Environment}

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Kisan RDS and Proxy
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ks-db-subnet-group-${Environment}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Backend Lambda to access RDS Proxy
      VpcId: !Ref ServerlessVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ks-lambda-sg-${Environment}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL and RDS Proxy
      VpcId: !Ref ServerlessVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ks-database-sg-${Environment}

  # ============================================================================
  # 2. DATABASE: Amazon RDS PostgreSQL + Amazon RDS Proxy
  # ============================================================================
  PostgreSqlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ks-db-credentials-${Environment}
      Description: Database credentials for Kisan Seva Kendra RDS
      SecretString: !Sub >
        {
          "username": "${DbUsername}",
          "password": "${DbPassword}",
          "engine": "postgres",
          "host": "",
          "port": 5432,
          "dbname": "kisan_seva_db"
        }

  PostgreSqlInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ks-postgres-${Environment}
      Engine: postgres
      EngineVersion: "16.1"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      DBName: kisan_seva_db
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      DeletionProtection: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub ks-postgres-${Environment}

  RdsProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-rds-proxy-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDbSecretPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PostgreSqlSecret

  RdsProxy:
    Type: AWS::RDS::DBProxy
    DependsOn: [PostgreSqlInstance]
    Properties:
      DBProxyName: !Sub ks-rds-proxy-${Environment}
      EngineFamily: POSTGRESQL
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref PostgreSqlSecret
          IAMAuth: DISABLED
      RoleArn: !GetAtt RdsProxyRole.Arn
      VpcSubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      IdleClientTimeout: 1800
      RequireTLS: false
      Tags:
        - Key: Name
          Value: !Sub ks-rds-proxy-${Environment}

  RdsProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref RdsProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref PostgreSqlInstance
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

  # ============================================================================
  # 3. S3 STORAGE: 4 DEDICATED BUCKETS (DATE-WISE FOLDERS)
  # ============================================================================
  SalesInvoicesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-sales-invoices-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldInvoices
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 365
                StorageClass: GLACIER

  PurchaseBillsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-purchase-bills-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldPurchases
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA

  GstReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-gst-reports-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldGstReports
            Status: Enabled
            Transitions:
              - TransitionInDays: 180
                StorageClass: STANDARD_IA

  StockReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-stock-reports-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================================
  # 4. NOTIFICATIONS: Amazon SNS
  # ============================================================================
  ReportAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ks-report-alerts-${Environment}
      Subscription:
        - Protocol: email
          Endpoint: !Ref ReportNotificationEmail

  # ============================================================================
  # 5. COMPUTE: AWS LAMBDA BACKEND & FRONTEND WITH FUNCTION URLS
  # ============================================================================
  BackendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-backend-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3ReportAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:HeadObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${SalesInvoicesBucket.Arn}/*
                  - !Sub ${PurchaseBillsBucket.Arn}/*
                  - !Sub ${GstReportsBucket.Arn}/*
                  - !Sub ${StockReportsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref PostgreSqlSecret

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ks-backend-api-${Environment}
      PackageType: Image
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt BackendLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DATABASE_URL: !Sub postgresql://${DbUsername}:${DbPassword}@${RdsProxy.Endpoint}:5432/kisan_seva_db
          S3_ENABLED: "True"
          S3_INVOICES_BUCKET: !Ref SalesInvoicesBucket
          S3_PURCHASES_BUCKET: !Ref PurchaseBillsBucket
          S3_GST_REPORTS_BUCKET: !Ref GstReportsBucket
          S3_STOCK_REPORTS_BUCKET: !Ref StockReportsBucket
          AWS_REGION_NAME: !Ref AWS::Region
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          AllowHeaders:
            - '*'
          ExposeHeaders:
            - Content-Disposition
            - Content-Type
          MaxAge: 86400
    Metadata:
      DockerTag: latest
      DockerContext: ../backend
      Dockerfile: Dockerfile.lambda

  FrontendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-frontend-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FrontendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ks-frontend-spa-${Environment}
      Runtime: python3.11
      Handler: lambda_handler.handler
      CodeUri: ../frontend
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt FrontendLambdaRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - HEAD
          MaxAge: 86400

  # ============================================================================
  # 6. ORCHESTRATION: AWS STEP FUNCTIONS (BACKEND & FRONTEND SEPARATELY)
  # ============================================================================
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ks-stepfunctions-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionExecutePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt BackendFunction.Arn
                  - !GetAtt FrontendFunction.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ReportAlertTopic

  BackendReportsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ks-backend-reports-pipeline-${Environment}
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub >
        {
          "Comment": "Kisan Seva Kendra - Asynchronous Monthly Financial & GST Report Generator",
          "StartAt": "ExtractMonthlyTransactions",
          "States": {
            "ExtractMonthlyTransactions": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${BackendFunction.Arn}",
                "Payload": {
                  "action": "extract_monthly_summary",
                  "month.$": "$.month",
                  "year.$": "$.year"
                }
              },
              "Next": "GenerateGstAndStockDocuments"
            },
            "GenerateGstAndStockDocuments": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "GenerateGstPdfAndUploadS3",
                  "States": {
                    "GenerateGstPdfAndUploadS3": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "${BackendFunction.Arn}",
                        "Payload": {
                          "action": "generate_gst_report_pdf",
                          "category": "gst_report",
                          "month.$": "$.month",
                          "year.$": "$.year"
                        }
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "GenerateStockValuationExcelAndUploadS3",
                  "States": {
                    "GenerateStockValuationExcelAndUploadS3": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "${BackendFunction.Arn}",
                        "Payload": {
                          "action": "generate_stock_valuation_excel",
                          "category": "stock_report",
                          "month.$": "$.month",
                          "year.$": "$.year"
                        }
                      },
                      "End": true
                    }
                  }
                }
              ],
              "Next": "NotifyOwnerReportReady"
            },
            "NotifyOwnerReportReady": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${ReportAlertTopic}",
                "Subject": "Monthly GST & Stock Report Ready - Kisan Seva Kendra",
                "Message": {
                  "status": "COMPLETED",
                  "period.$": "$.[0].period",
                  "gstReportUrl.$": "$.[0].downloadUrl",
                  "stockReportUrl.$": "$.[1].downloadUrl"
                }
              },
              "End": true
            }
          }
        }

  FrontendDeployStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ks-frontend-deploy-pipeline-${Environment}
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub >
        {
          "Comment": "Kisan Seva Kendra - Frontend SPA Asset Warmup & Deployment Pipeline",
          "StartAt": "ValidateFrontendBundle",
          "States": {
            "ValidateFrontendBundle": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${FrontendFunction.Arn}",
                "Payload": {
                  "action": "validate_bundle"
                }
              },
              "Next": "PrewarmFrontendContainers"
            },
            "PrewarmFrontendContainers": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${FrontendFunction.Arn}",
                "Payload": {
                  "action": "warmup"
                }
              },
              "Next": "NotifyFrontendReady"
            },
            "NotifyFrontendReady": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${ReportAlertTopic}",
                "Subject": "SUCCESS: Frontend Deployed & Prewarmed",
                "Message": {
                  "status": "ACTIVE",
                  "environment": "${Environment}"
                }
              },
              "End": true
            }
          }
        }

Outputs:
  FrontendFunctionUrl:
    Description: Immediate public HTTPS Function URL to access Frontend SPA
    Value: !GetAtt FrontendFunctionUrl.FunctionUrl

  BackendFunctionUrl:
    Description: Immediate public HTTPS Function URL to access Backend FastAPI
    Value: !GetAtt BackendFunctionUrl.FunctionUrl

  RdsProxyEndpoint:
    Description: Amazon RDS Proxy Endpoint for PostgreSQL connection pooling
    Value: !GetAtt RdsProxy.Endpoint

  SalesInvoicesBucketName:
    Description: S3 Bucket storing Sales Invoices
    Value: !Ref SalesInvoicesBucket

  PurchaseBillsBucketName:
    Description: S3 Bucket storing Purchase Bills
    Value: !Ref PurchaseBillsBucket

  GstReportsBucketName:
    Description: S3 Bucket storing GST Reports
    Value: !Ref GstReportsBucket

  StockReportsBucketName:
    Description: S3 Bucket storing Stock Valuation Reports
    Value: !Ref StockReportsBucket

  BackendReportsStateMachineArn:
    Description: ARN for Backend Reports Step Functions State Machine
    Value: !GetAtt BackendReportsStateMachine.Arn

  FrontendDeployStateMachineArn:
    Description: ARN for Frontend Deployment Step Functions State Machine
    Value: !GetAtt FrontendDeployStateMachine.Arn
