version = 0.1

[default.deploy.parameters]
stack_name = "ks-serverless-prod"
resolve_s3 = true
resolve_image_repos = true
s3_prefix = "ks-serverless-prod"
region = "ap-south-1"
confirm_changeset = false
fail_on_empty_changeset = false
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
parameter_overrides = "Environment=\"prod\" DbUsername=\"kisan_admin\" DbAllocatedStorage=\"20\" VpcCidr=\"10.0.0.0/16\""

[default.global.parameters]
region = "ap-south-1"
