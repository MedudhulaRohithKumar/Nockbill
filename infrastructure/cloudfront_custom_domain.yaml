AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Kisan Seva Kendra - Phase 2 Custom Domain & CDN Architecture:
  Amazon CloudFront Distribution with Custom Domain, Route53, ACM SSL,
  Unified Path-Based Routing (/api/* and /uploads/* DIRECTLY to Backend Lambda Function URL,
  /* to Frontend SPA Lambda),
  Edge Caching, Security Headers, and WAF.

Parameters:
  DomainName:
    Type: String
    Default: kisansevakendra.in
    Description: Your registered domain name (e.g., kisansevakendra.in)

  Subdomain:
    Type: String
    Default: app
    Description: Subdomain for the ERP application (e.g., app.kisansevakendra.in)

  FrontendFunctionUrlDomain:
    Type: String
    Description: Domain name of the Frontend Lambda Function URL (without https://)

  BackendFunctionUrlDomain:
    Type: String
    Description: Domain name of the Backend Lambda Function URL (without https://)

  AcmCertificateArn:
    Type: String
    Description: ARN of validated ACM Certificate in us-east-1 for CloudFront

Resources:
  # ============================================================================
  # 1. CLOUDFRONT SECURITY HEADERS POLICY
  # ============================================================================
  EdgeSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: KisanSevaEdgeSecurityPolicy
        Comment: Enforces Strict CSP, HSTS, and hides origin server fingerprints
        # CSP: connect-src has no blanket https: (API is same-origin via /api/*). style-src keeps
        # 'unsafe-inline' as an accepted risk (React inline style attributes cannot be nonced).
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
            Override: true
        RemoveHeadersConfig:
          Items:
            - Header: Server
            - Header: X-Powered-By
            - Header: x-amz-server-side-encryption

  # ============================================================================
  # 2. CACHE POLICIES
  # ============================================================================
  # Static Asset Cache Policy (1 Year Immutable)
  StaticAssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: KisanSevaStaticAssetCachePolicy
        Comment: Maximize CDN cache hit ratio for Vite hashed assets
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Dynamic API traffic (/api/*, /uploads/*) uses AWS managed policies:
  #   Cache policy:          CachingDisabled           (4135ea2d-6df8-47a0-a0da-92f2a2a5f3b5)
  #   Origin request policy: AllViewerExceptHostHeader (b689b0a8-53d0-40ab-baf2-68738e2966ac)
  # AllViewerExceptHostHeader forwards ALL viewer headers (Authorization, Origin, Content-Type,
  # Accept...), all cookies and all query strings, but NOT Host, which is required because a
  # Lambda Function URL rejects a Host header that differs from its own domain.

  # ============================================================================
  # 3. CLOUDFRONT LOGGING & DISTRIBUTION (Unified Origin)
  # ============================================================================
  CloudFrontAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ks-cf-access-logs-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90

  UnifiedDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Unified CDN routing for Kisan Seva Kendra
        Logging:
          Bucket: !GetAtt CloudFrontAccessLogsBucket.RegionalDomainName
          Prefix: cdn-access/
          IncludeCookies: false
        Aliases:
          - !Sub ${Subdomain}.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        PriceClass: PriceClass_All

        Origins:
          # Origin 1: Frontend SPA Lambda Function URL
          - Id: FrontendSpaOrigin
            DomainName: !Ref FrontendFunctionUrlDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

          # Origin 2: Backend FastAPI Lambda Function URL
          - Id: BackendApiOrigin
            DomainName: !Ref BackendFunctionUrlDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        # Default Behavior: Frontend SPA (/*)
        DefaultCacheBehavior:
          TargetOriginId: FrontendSpaOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref StaticAssetCachePolicy
          ResponseHeadersPolicyId: !Ref EdgeSecurityHeadersPolicy

        # Request flow (B4): API traffic goes Viewer -> CloudFront -> Backend Lambda Function URL
        # directly (no Frontend Lambda hop). The Frontend Lambda serves ONLY the SPA / static
        # assets (default behavior and /assets/*).
        # Cache Behavior 1: Backend API (/api/*)
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-47a0-a0da-92f2a2a5f3b5
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref EdgeSecurityHeadersPolicy

          # Cache Behavior 1b: Uploaded files served by the backend (/uploads/*)
          - PathPattern: /uploads/*
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-47a0-a0da-92f2a2a5f3b5
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref EdgeSecurityHeadersPolicy

          # Cache Behavior 2: Static Hashed Assets (/assets/*)
          - PathPattern: /assets/*
            TargetOriginId: FrontendSpaOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref EdgeSecurityHeadersPolicy

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref UnifiedDistribution

  CloudFrontDomainName:
    Description: CloudFront Assigned Domain Name (e.g. d123456.cloudfront.net)
    Value: !GetAtt UnifiedDistribution.DomainName

  CustomApplicationUrl:
    Description: Final Custom HTTPS URL after Route53 CNAME record creation
    Value: !Sub https://${Subdomain}.${DomainName}
