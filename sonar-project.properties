# -----------------------------------------------------------------------------
# SonarCloud Configuration - NockBill
# -----------------------------------------------------------------------------

# Organization and Project Key from SonarCloud
sonar.organization=medudhularohithkumar
sonar.projectKey=MedudhulaRohithKumar_Nockbill
sonar.projectName=NockBill

# Source and Test directories for Python backend and React frontend
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Code Coverage report paths
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# File encoding
sonar.sourceEncoding=UTF-8

# Language specifications
sonar.python.version=3.11
sonar.javascript.environments=browser

# Excluded folders and files from scanning
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/.venv_win/**,\
  **/python311/**,\
  **/.aws-sam/**,\
  **/scratch/**,\
  **/tests/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/scripts/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.timestamp-*.mjs
