version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: fertilizer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fertilizer_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fertilizer_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend with OCR (Tesseract)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fertilizer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/fertilizer_shop
      SECRET_KEY: fertilizer-shop-production-secret-key-change-in-prod
      TESSERACT_CMD: tesseract
      HOST: 0.0.0.0
      PORT: 8000
      SES_ENABLED: "True"
      SES_SENDER_EMAIL: admin@nockbill.com
      GOOGLE_CLIENT_ID: 995123724994-6ejbal37p88sp32fmedph6k296uf8n7k.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads

  # 3. React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fertilizer_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000/api
      VITE_GOOGLE_CLIENT_ID: 995123724994-6ejbal37p88sp32fmedph6k296uf8n7k.apps.googleusercontent.com

volumes:
  postgres_data:
